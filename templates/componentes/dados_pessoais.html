<div class="card">

<h2>Dados pessoais</h2>

<div class="grid">

    <div>

        <label>Nome</label>

        <input
            type="text"
            name="nome"
            placeholder="Nome completo">

            {% if erros and erros.nome %}
                <p class="erro-campo">
                    {{erros.nome}}
                </p>
            {% endif %}

    </div>

    <div>

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="E-mail">

            {% if erros and erros.email %}
                <p class="erro-campo">
                    {{ erros.email }}
                </p>
            {% endif %}

    </div>

    <div>

        <label>Telefone</label>

        <input
            type="text"
            name="telefone"
            placeholder="(XX)XXXXX-XXXX">

            {% if erros and erros.telefone %}
                <p class="erro-campo">
                    {{erros.telefone}}
                </p>
            {% endif %}

    </div>

    <div>

        <label>Cidade</label>

        <input
            type="text"
            name="cidade">

    </div>

</div>

</div>
